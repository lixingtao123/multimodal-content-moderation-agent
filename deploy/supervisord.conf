[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/app/tmp/supervisord.pid
user=root

[program:postgres]
command=/bin/bash -c "chown -R postgres:postgres /data/postgres && if [ ! -d /data/postgres/base ]; then sudo -u postgres /usr/lib/postgresql/14/bin/initdb -D /data/postgres; fi && sudo -u postgres /usr/lib/postgresql/14/bin/postgres -D /data/postgres -c config_file=/etc/postgresql/14/main/postgresql.conf -c listen_addresses='*'"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/app/logs/postgres.log
stderr_logfile=/app/logs/postgres.err.log

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes
autostart=true
autorestart=true
stdout_logfile=/app/logs/redis.log
stderr_logfile=/app/logs/redis.err.log

[program:chroma]
command=/bin/bash -c "source /app/venv/bin/activate && python -c \"import chromadb; chromadb.PersistentClient(path='/data/chroma'); print('ChromaDB initialized')\" 2>/dev/null || true && uvicorn chromadb.app:app --host 0.0.0.0 --port 8001"
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/app/logs/chroma.log
stderr_logfile=/app/logs/chroma.err.log

[program:funasr]
command=/bin/bash -c "source /app/venv/bin/activate && cd /app/funasr && uvicorn server:app --host 0.0.0.0 --port 5001"
directory=/app/funasr
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/app/logs/funasr.log
stderr_logfile=/app/logs/funasr.err.log

[program:backend]
command=/bin/bash -c "source /app/venv/bin/activate && cd /app/backend && uvicorn main:app --host 0.0.0.0 --port 8000"
directory=/app/backend
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/app/logs/backend.log
stderr_logfile=/app/logs/backend.err.log

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/app/logs/nginx.log
stderr_logfile=/app/logs/nginx.err.log

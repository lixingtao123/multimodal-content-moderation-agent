# 内容风控智能治理系统 — ruff 质量门配置（R0 建立）
#
# 说明：
# - 从 R0 起，`ruff check .` 是质量门 G0 的 L0 静态检查。
# - 只启用"真 bug 类"规则（SyntaxError 级 + undefined name），保证历史代码全绿、门有效。
# - 历史风格欠账（F401 未用 import、F841 未用变量、UP 类型现代化等 ~190 个核心级问题）
#   在后续轮次触达对应文件时顺手清理，R18 全量回归前统一收官；不在 R0 引入大 diff。
# - 新增/改动代码若出现 undefined name 或语法错误，会被此门直接挡住。
[lint]
select = ["E9", "F821"]
